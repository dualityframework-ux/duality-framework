name: Test Variance
on:
  workflow_call:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node variance/test.js
      - run: node variance/challenge-test.js
      - run: node notes/inventory-finance/test.js
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variance/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
  contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright
      - name: WCAG AA contrast, light and dark
        run: python tests/check_contrast.py index.html changelog.html variance/index.html variance/case-study.html variance/one-pager.html frame2/index.html frame2/case-study.html notes/gross-vs-net.html notes/abc-classes.html notes/variance-sql.html notes/inventory-finance.html
      - name: No sideways scroll at phone widths
        run: python tests/check_phone_width.py index.html changelog.html variance/index.html variance/case-study.html variance/one-pager.html frame2/index.html frame2/case-study.html notes/gross-vs-net.html notes/abc-classes.html notes/variance-sql.html notes/inventory-finance.html

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_variance.py
      - run: python tests/browser_home.py
      - run: python tests/browser_case_study.py
      - run: python tests/browser_frame2.py
      - run: python tests/browser_one_pager.py
      - run: python tests/browser_inventory_finance.py
